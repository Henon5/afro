              <div style="max-height:500px; overflow-y:auto;">
                ${users.map(user => `
                  <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; margin:8px 0; background:white; border-radius:8px; border:1px solid #e0e0e0; box-shadow:0 2px 6px rgba(0,0,0,0.05);">
                    <div style="flex:1;">
                      <div style="font-weight:700; color:var(--dark);">${user.username || user.firstName || 'Unknown'}</div>
                      <div style="font-size:0.85rem; color:var(--gray); margin-top:4px;">
                        Balance: <b style="color:var(--green);">${user.balance} ETB</b><br>
                        Games: ${user.gamesPlayed || 0} | Wins: ${user.totalWins || 0}<br>
                        <small>${user.phone || user.telegramId ? '📱 ' + (user.phone || user.telegramId) : ''}</small>
                      </div>
                    </div>
                    <button class="btn btn-red btn-sm clear-balance-btn" data-user-id="${user._id}" data-username="${user.username || user.firstName || 'Unknown'}" data-balance="${user.balance}" style="padding:6px 12px; font-size:0.8rem;">Clear</button>
                  </div>
                `).join('')}
              </div>
            ` : '<p style="text-align:center; color:var(--gray); padding:20px;">No users found</p>'}
            
            <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()" style="margin-top:15px; width:100%;">Close</button>
          </div>
        `;
        
        document.body.appendChild(modal);
        
        // Add event listeners for clear balance buttons
        modal.querySelectorAll('.clear-balance-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const userId = btn.dataset.userId;
            const username = btn.dataset.username;
            const balance = btn.dataset.balance;
            
            if (confirm(`⚠️ WARNING: This will set ${username}'s balance from ${balance} ETB to 0 ETB. This action cannot be undone!\n\nAre you sure you want to proceed?`)) {
              try {
                showLoading('Clearing balance...');
                await Api.clearUserBalance(userId, AppState.admin.token);
                hideLoading();
                showToast(`✅ ${username}'s balance cleared successfully`, 'success');
                console.log(`⚠️ ADMIN ACTION: Cleared balance for ${username}. Amount removed: ${balance} ETB`);
                
                // Refresh the popup
                modal.remove();
                showUserBalancePopup();
              } catch (error) {
                hideLoading();
                showToast('Failed to clear balance: ' + (error.message || 'Unknown error'), 'error');
              }
            }
          });
        });
        
      } catch (error) {
        hideLoading();
        showToast('Failed to load users: ' + (error.message || 'Unknown error'), 'error');
        modal.remove();
      }
    }

    // ============================================
    // 🎯 ROOM JOINING
    // ============================================
    async function tryJoinRoom(amount) {
      console.log('🎯 tryJoinRoom called with amount:', amount);
      
      // FIX: Set selectedRoom before any other logic
      if(AppState.user) {
        AppState.user.selectedRoom = amount;
        console.log('✅ Set selectedRoom to:', amount);
      }
      
      if(!AppState.user) {
        try {
          const response = await Api.syncUser();
          AppState.user = response.user || response;
          AppState.user.selectedRoom = amount; // Set after loading user too
          console.log('✅ Loaded user and set selectedRoom to:', amount);
        } catch (error) {
          showToast('Please restart the app', 'error');
          return;
        }
      }
      
      if(AppState.user.isBlocked) {
        showToast('Account blocked', 'error');
        return;
      }
      
      if(AppState.user.balance < amount) {
        showToast(`Insufficient balance! Need ${amount} ETB.`, 'error');
        Sound.error();
        
        if(confirm('Would you like to deposit funds now?')) {
          showPage('deposit');
        }
        return;
      }
      
      console.log('🚀 Showing cartela selection for amount:', amount);
      // Show cartela selection page before joining
      showPage('cartela');
    }

    async function joinRoom(amount) {
      try {
        console.log('🎮 joinRoom: Joining room with amount:', amount);
        const selectedCard = AppState.user?.selectedCard || null;
        const response = await Api.joinRoom(amount, true, selectedCard); // Always join with bots
        
        console.log('✅ joinRoom response:', response);
        
        if (response.game && response.game.newBalance !== undefined) {
          AppState.user.balance = response.game.newBalance;
        }
        AppState.game.roomAmount = amount;
        console.log('✅ Set AppState.game.roomAmount to:', amount);
        
        if (response.game) {
          AppState.game.cardGrid = response.game.cardGrid;
          AppState.game.markedState = response.game.markedState;
          AppState.game.sessionId = response.game.sessionId;
          AppState.game.currentPool = response.game.currentPool || response.game.totalPrize;
          AppState.game.playersCount = response.game.playersCount;
          AppState.game.botPlayers = response.game.botPlayers || 0;
          AppState.game.calledNumbers = response.game.calledNumbers || [];
          AppState.game.currentNumbers = response.game.calledNumbers && response.game.calledNumbers.length ? [response.game.calledNumbers[response.game.calledNumbers.length - 1]] : [];
          AppState.game.isGameActive = true;
        }
        
        showToast(response.message || 'Joined room!', 'success');
        Sound.success();
        
        showPage('bingo');
        updateBingoDisplay(); // Update the bingo page display with pool and player info
        loadRooms(); // Reload rooms to update pool display
        
        // Initialize Socket.io connection and join game room
        initSocket(response.game.sessionId);
      } catch (error) {
        console.error('Failed to join room:', error);
        showToast(error.message || 'Failed to join room', 'error');
      }
    }

    // ============================================
    // 🔌 SOCKET.IO CONNECTION
    // ============================================
    async function loadSocketIoClient() {
      if (window.io) return window.io;

      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.socket.io/4.7.2/socket.io.min.js';
        script.async = true;
        script.onload = () => {
          if (window.io) return resolve(window.io);
          reject(new Error('Socket.io client loaded but `io` is unavailable.'));
        };
        script.onerror = () => reject(new Error('Failed to load socket.io client script.'));
        document.head.appendChild(script);
      });
    }

    async function initSocket(sessionId) {
      console.log('🔌 Initializing socket connection for session:', sessionId);
      
      if (!window.io && typeof io === 'undefined') {
        try {
          await loadSocketIoClient();
          console.log('✅ socket.io client loaded dynamically');
        } catch (err) {
          console.error('🔴 Failed to load socket.io client:', err);
          showToast('Realtime connection failed. Please reload the page.', 'error');
          return;
        }
      }

      const socketClient = window.io || (typeof io !== 'undefined' ? io : null);
      if (!socketClient) {
        console.error('🔴 Socket.io client is not available after load.');
        showToast('Realtime connection is unavailable.', 'error');
        return;
      }
updateConnectionStatus('connected');
        AppState.socket.emit('joinGame', { sessionId: sessionId });
        showToast('🔗 Connected to game server', 'success');
      });
      
      AppState.socket.on('disconnect', (reason) => {
        console.log('❌ Socket disconnected:', reason);
        updateConnectionStatus('disconnected');
        // Show warning if disconnected unexpectedly
        if (reason !== 'io client namespace disconnect') {
          showToast('⚠️ Disconnected from server. Attempting to reconnect...', 'warning');
        }
      });
      
      AppState.socket.on('connect_error', (error) => {
        console.error('🔴 Socket connection error:', error.message);
        console.error('   Error data:', error);
        updateConnectionStatus('disconnected');
        showToast('🔌 Connection error: ' + (error.message || 'Unknown error'), 'error');
      });
      
      AppState.socket.on('reconnect', (attemptNumber) => {
        console.log('✅ Socket reconnected after', attemptNumber, 'attempt(s)');
        updateConnectionStatus('connected');
        showToast('✅ Reconnected to game server', 'success');
      });
      
      AppState.socket.on('reconnect_attempt', () => {
        console.log('🔄 Attempting to reconnect to socket...');
        updateConnectionStatus('connecting
        reconnectionAttempts: 5,
        reconnectionDelay: 1000
      });
      
      // Also expose via window.socket for global access
      window.socket = AppState.socket;
      
      AppState.socket.on('connect', () => {
        console.log('✅ Socket connected:', AppState.socket.id);
        console.log('🚀 Emitting joinGame event for session:', sessionId);
        AppState.socket.emit('joinGame', { sessionId: sessionId });
        showToast('🔗 Connected to game server', 'success');
      });
      
      AppState.socket.on('disconnect', (reason) => {
        console.log('❌ Socket disconnected:', reason);
        // Show warning if disconnected unexpectedly
        if (reason !== 'io client namespace disconnect') {
          showToast('⚠️ Disconnected from server. Attempting to reconnect...', 'warning');
        }
      });
      
      AppState.socket.on('connect_error', (error) => {
        console.error('🔴 Socket connection error:', error.message);
        console.error('   Error data:', error);
        showToast('🔌 Connection error: ' + (error.message || 'Unknown error'), 'error');
      });
      
      AppState.socket.on('reconnect', (attemptNumber) => {
        console.log('✅ Socket reconnected after', attemptNumber, 'attempt(s)');
        showToast('✅ Reconnected to game server', 'success');
      });
      
      AppState.socket.on('reconnect_attempt', () => {
        console.log('🔄 Attempting to reconnect to socket...');
      });
      
      AppState.socket.on('reconnect_error', (error) => {
        console.error('⚠️ Socket reconnection error:', error.message);
      });
      
      // Game events
      AppState.socket.on('numberCalled', async (data) => {
        console.log('🎱 Number called:', data);
        await handleNumberCalled(data);
      });
      
      AppState.socket.on('gameStarted', (data) => {
        console.log('🎮 Game started:', data);
        // Update bot count if provided in game start data
        if (data.botPlayers !== undefined) {
          AppState.game.botPlayers = data.botPlayers;
        }
        showToast('Game started!', 'info');
        Sound.success();
      });
      
      AppState.socket.on('bingoWin', (data) => {
        console.log('🎉 Bingo win:', data);
        showWinnerAnnouncement(data.winnerName, data.amount);
        Sound.win();
      });
      
      AppState.socket.on('gameEnd', (data) => {
        console.log('🏁 Game ended:', data);
        // Reset bot count on game end
        AppState.game.botPlayers = 0;
        handleGameEnd(data);
      });
      
      AppState.socket.on('playerJoined', (data) => {
        console.log('👤 Player joined:', data);
        updatePlayerCount(data.count, data.isBot);
      });
      
      AppState.socket.on('playerLeft', (data) => {
        console.log('👤 Player left:', data);
        updatePlayerCount(data.count, data.isBot);
      });
      
      // Bot-specific events for better tracking
      AppState.socket.on('botJoined', (data) => {
        console.log('🤖 Bot joined:', data);
        if (AppState.game.botPlayers !== undefined) {
          AppState.game.botPlayers = (AppState.game.botPlayers || 0) + 1;
        }
        updatePlayerCount(data.count, true);
      });
      
      AppState.socket.on('botLeft', (data) => {
        console.log('🤖 Bot left:', data);
        if (AppState.game.botPlayers !== undefined && AppState.game.botPlayers > 0) {
          AppState.game.botPlayers--;
        }
        updatePlayerCount(data.count, true);
      });
      
      // Bingo claim acknowledgment
      AppState.socket.on('bingoClaimAck', (data) => {
        console.log('🎯 [SOCKET] Bingo claim acknowledgment:', data);
        if (data.status === 'received') {
          showToast('Bingo claim submitted...', 'info');
        }
      });
      
      // Bot move events - bots playing fairly like humans
      AppState.socket.on('BOT_MOVE', (data) => {
        console.log('🤖 Bot move received:', data);
        if (data.botMarks && data.botMarks.length > 0) {
          // Update progress display
          data.botMarks.forEach(botMark => {
            console.log(`${botMark.name} has ${botMark.markedCount} marks`);
          });
          showToast(`${data.botMarks.length} players marked numbers`, 'info');
        }
      });
      
      // Game over event
      AppState.socket.on('GAME_OVER', (data) => {
        console.log('🏆 Game Over:', data);
        const redirectTo = data?.redirectTo || 'lobby';
        const message = data?.message || `${data?.winner || 'Someone'} won with ${data?.pattern || 'a bingo pattern'}!`;
        showToast(message, data?.isBot ? 'info' : 'success');
        AppState.game.isGameActive = false;
        setTimeout(() => {
          if (AppState.socket) {
            AppState.socket.disconnect();
            AppState.socket = null;
          }
          showPage(redirectTo);
        }, 2200);
      });
      
      AppState.socket.on('error', (error) => {
        console.error('🔴 Socket error:', error);
        showToast(error.message || 'Socket error', 'error');
      });
      
      console.log('✅ Socket initialization complete');
    }
    
    async function handleNumberCalled(data) {
      const num = Number(data.number);
      if (!AppState.game.calledNumbers.includes(num)) {
        AppState.game.calledNumbers.push(num);
      }
      AppState.game.currentNumbers = [num];
      updateBingoDisplay();
      updateNumbersHistory();

      try {
        const grid = AppState.game.cardGrid || [];
        const marked = AppState.game.markedState || [];
        let found = false;

        for (let r = 0; r < (grid.length || 5); r++) {
          for (let c = 0; c < (grid[r]?.length || 5); c++) {
            if (grid[r][c] === num && !marked[r][c] && !(r === 2 && c === 2)) {
              found = true;
              const cell = document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
              if (cell) cell.classList.add('called');

              const resp = await Api.markNumber({ sessionId: AppState.game.sessionId, row: r, col: c });
              const isMarked = resp.marked === true;
              AppState.game.markedState[r][c] = isMarked;

              if (cell) {
                if (isMarked) cell.classList.add('marked'); else cell.classList.remove('marked');
              }
              updateMatchesCount();

              if (resp.win) {
                if (!resp.isBot) {
                  handleWin();
                }
              }

              break;
            }
          }
          if (found) break;
        }
      } catch (err) {
        console.error('Error scanning card for auto-mark:', err);
      }
    }
    
    function handleGameEnd(data) {
      AppState.game.isGameActive = false;
      if (AppState.game.autoInterval) {
        clearInterval(AppState.game.autoInterval);
        AppState.game.autoInterval = null;
      }
      AppState.game.isAutoPlaying = false;
      showToast('Game ended!', 'info');
    }
    
    function updatePlayerCount(count, isBot = false) {
      // Only update total count, don't modify botPlayers here as it's handled by bot events
      AppState.game.playersCount = count;
      updateBingoDisplay();
    }

    // ============================================
    // 🚀 APP INITIALIZATION
    // ============================================
    async function initApp() {
      console.log('🚀 [INIT] Starting app initialization...');
      console.log('🔧 Backend API URL:', CONFIG.API_BASE);
      
      // Check server connectivity
      try {
        console.log('🔌 [INIT] Testing server connectivity...');
        const response = await fetch(`${CONFIG.API_BASE.replace('/api', '')}/health`, {
          method: 'GET',
          timeout: 5000
        });
        if (response.ok) {
          console.log('✅ [INIT] Server is reachable');
          updateConnectionStatus('connected');
        } else {
          console.warn('⚠️ [INIT] Server returned non-OK status:', response.status);
          updateConnectionStatus('disconnected');
          showToast('⚠️ Server connection status unclear', 'warning');
        }
      } catch (err) {
        console.error('❌ [INIT] Server connectivity check failed:', err.message);
        updateConnectionStatus('disconnected');
        showToast('⚠️ Cannot reach server. Using offline mode.', 'warning');
      }
      
      initTelegram();
      
      try {
        const response = await Api.syncUser();
        // Merge user data properly, ensuring all fields are available
        AppState.user = { 
          ...AppState.user, 
          ...(response.user || response),
          displayName: (response.user || response).displayName || (response.user || response).firstName || 'Player'
        };
        console.log('✅ User loaded:', AppState.user);
      } catch (error) {
        // If syncUser fails, show login error instead of falling back to guest/offline mode
        console.error('❌ Failed to authenticate user:', error);
        showToast('Authentication failed. Please log in again.', 'error');
        AppState.user = null;
      }
      
      showPage('lobby');
      
      window.addEventListener('beforeunload', (e) => {
        if(AppState.game.isGameActive) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    }

    // ============================================
    // 🌍 GLOBAL EVENT LISTENERS
    // ============================================
    document.addEventListener('DOMContentLoaded', initApp);
    
    document.addEventListener('visibilitychange', () => {
      if(document.hidden && AppState.game.isAutoPlaying) {
        // Optional: pause game
      }
    });
    
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && AppState.currentPage !== 'lobby') {
        showPage('lobby');
      }
    });

    // ============================================
    // 🌐 EXPOSE GLOBAL FUNCTIONS
    // ============================================
    window.showPage = showPage;
    window.tryJoinRoom = tryJoinRoom;
    window.exitGame = exitGame;
    window.showSupport = showSupport;
    window.copyText = copyText;
    window.showWithdrawModal = showWithdrawModal;
    window.saveProfile = saveProfile;
    window.checkForBingo = checkForBingo;
    window.requestDeposit = requestDeposit;
    window.showAdminLogin = showAdminLogin;
    window.showUserBalancePopup = showUserBalancePopup;
    window.updateBingoDisplay = updateBingoDisplay;
    window.initSocket = initSocket;
    window.refreshBalance = refreshBalance;
    window.updateConnectionStatus = updateConnectionStatus;
    
    window.AppState = AppState;
    window.Api = Api;
    window.CONFIG = CONFIG;
    window.socket = null; // Expose socket globally for easy access
  </script>
</body>
